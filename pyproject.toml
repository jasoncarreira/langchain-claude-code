[project]
name = "langchain-claude-code"
version = "0.1.0"
description = "LangChain chat model wrapper for Claude Code Agent SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.10",
    "langchain>=1.1.0",
    "langchain-community>=0.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_claude_code"]
