[project]
name = "langchain-claude-code"
version = "0.1.0"
description = "LangChain chat model wrapper for Claude Code Agent SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tomas Roda", email = "dev@tomasroda.com" }]
keywords = ["langchain", "claude", "anthropic", "agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["claude-agent-sdk>=0.1.10", "langchain-core>=0.3.0"]

[project.optional-dependencies]
examples = [
    "ddgs>=9.9.2",
    "deepagents>=0.2.8",
    "langchain>=1.1.0",
    "langchain-community>=0.4.1",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/agentmish/langchain-claude-code"
Repository = "https://github.com/agentmish/langchain-claude-code"
Issues = "https://github.com/agentmish/langchain-claude-code/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_claude_code"]

[tool.hatch.build.targets.sdist]
exclude = ["digest.txt", "docs/", ".cursor/", "AGENTS.md"]
