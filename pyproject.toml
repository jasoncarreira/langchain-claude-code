[project]
# Published as ``langchain-claude-code-mimir``: upstream
# (thehumanworks/langchain-claude-code) is dormant, so this fork carries the
# adapter-level fixes Mimir depends on and ships under its own distribution
# name. The import package stays ``langchain_claude_code``, so consumers keep
# writing ``from langchain_claude_code import ChatClaudeCode``.
#
# Keep the name and version here, in version control. 0.1.1 and 0.1.2 were
# published with the rename and bump applied out of band, which left the repo
# declaring 0.1.0 with no tags, so nothing recorded what a release contained.
# Tag v0.1.2 marks the source verified byte-identical to the published 0.1.2
# sdist. Bump this version in the release commit and tag that commit.
name = "langchain-claude-code-mimir"
version = "0.1.2"
description = "LangChain chat model wrapper for Claude Code Agent SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tomas Roda", email = "dev@tomasroda.com" }]
keywords = ["langchain", "claude", "anthropic", "agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["claude-agent-sdk>=0.1.10", "langchain-core>=0.3.0"]

[project.optional-dependencies]
examples = [
    "ddgs>=9.9.2",
    "deepagents>=0.2.8",
    "langchain>=1.1.0",
    "langchain-community>=0.4.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Used in the runtime-injected-args skip test — verifies our bridge
    # filters out tools annotated with langgraph's ``ToolRuntime``.
    # Runtime is optional at production time (the helper falls back to
    # returning False if langgraph isn't installed), so it lives in
    # ``dev`` rather than core ``dependencies``.
    "langgraph>=0.2",
]

[project.urls]
Homepage = "https://github.com/agentmish/langchain-claude-code"
Repository = "https://github.com/agentmish/langchain-claude-code"
Issues = "https://github.com/agentmish/langchain-claude-code/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_claude_code"]

[tool.hatch.build.targets.sdist]
exclude = ["digest.txt", "docs/", ".cursor/", "AGENTS.md"]
